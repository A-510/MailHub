<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="title desc">
  <title id="title">MailHub · 多邮箱聚合书房客户端</title>
  <desc id="desc">MailHub 项目主视觉图：左侧展示项目定位、本地加密特性与核心技术栈，右侧以纯矢量结构展示四栏 2.5D 立体书籍邮箱界面。</desc>

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E162E" />
      <stop offset="55%" stop-color="#261C3B" />
      <stop offset="100%" stop-color="#1A1228" />
    </linearGradient>
    <radialGradient id="glowRose" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#E7749B" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#E7749B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.22" cy="0.82" r="0.55">
      <stop offset="0%" stop-color="#8C6BE8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8C6BE8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="emblemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9DC4" />
      <stop offset="100%" stop-color="#8C6BE8" />
    </linearGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8BFC8" />
      <stop offset="50%" stop-color="#D9A7B8" />
      <stop offset="100%" stop-color="#B9859C" />
    </linearGradient>
    <linearGradient id="activePill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E78BB6" />
      <stop offset="100%" stop-color="#8C6BE8" />
    </linearGradient>
    <linearGradient id="spineShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#744E76" stop-opacity="0" />
      <stop offset="50%" stop-color="#744E76" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#744E76" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 暗夜书房主底板 -->
  <rect x="0" y="0" width="1200" height="440" rx="24" fill="url(#heroBg)" />
  <rect x="0" y="0" width="1200" height="440" rx="24" fill="url(#glowRose)" />
  <rect x="0" y="0" width="1200" height="440" rx="24" fill="url(#glowViolet)" />
  <rect x="1" y="1" width="1198" height="438" rx="23" fill="none" stroke="#4B3969" stroke-width="2" />

  <!-- 左侧：品牌标识、价值主张与技术徽章 -->
  <g id="hero-copy" transform="translate(52 44)">
    <rect x="0" y="0" width="388" height="36" rx="18" fill="#2D2246" stroke="#6E52A8" stroke-width="1.5" />
    <circle cx="22" cy="18" r="5" fill="#F08DB8" />
    <text x="38" y="24"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="600" fill="#E3D7FA">LOCAL-FIRST · 2.5D BOOK MAIL</text>

    <!-- 信封图标 + 衬线主标题 -->
    <g transform="translate(0 58)">
      <rect x="0" y="4" width="56" height="44" rx="12" fill="url(#emblemGrad)" stroke="#FFF8FC" stroke-width="1.8" />
      <path d="M10 17 L28 31 L46 17" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="10" y="15" width="36" height="23" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2" />
      <text x="72" y="43"
            font-family="Georgia, 'Noto Serif SC', 'Songti SC', serif"
            font-size="56" font-weight="700" fill="#FFF9FC" letter-spacing="-0.5">MailHub</text>
    </g>

    <text x="0" y="152"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="28" font-weight="700" fill="#F5B2D0">多邮箱聚合书房客户端</text>

    <text x="0" y="198"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="20" fill="#DDD2EF">把 QQ、163、Gmail、Outlook 与校园 / 企业邮箱，</text>
    <text x="0" y="228"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="20" fill="#DDD2EF">收进一本支持 3D 翻页的本地加密手账书桌。</text>

    <!-- 核心技术栈标签 -->
    <g transform="translate(0 264)">
      <rect x="0" y="0" width="166" height="40" rx="12" fill="#2D2246" stroke="#5A4582" stroke-width="1.5" />
      <text x="83" y="26" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="600" fill="#F2EAFF">Vue 3 + FastAPI</text>

      <rect x="178" y="0" width="174" height="40" rx="12" fill="#2D2246" stroke="#5A4582" stroke-width="1.5" />
      <text x="265" y="26" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="600" fill="#F2EAFF">Fernet · OAuth2</text>

      <rect x="364" y="0" width="144" height="40" rx="12" fill="#2D2246" stroke="#5A4582" stroke-width="1.5" />
      <text x="436" y="26" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="18" font-weight="600" fill="#F2EAFF">SQLite FTS5</text>
    </g>

    <!-- 运行边界提示 -->
    <g transform="translate(0 334)">
      <circle cx="8" cy="12" r="5" fill="#34D399" />
      <text x="22" y="18"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
            font-size="18" fill="#BFAFD9">127.0.0.1:8765 本地守护 · 零云端中转 · 明暗双主题</text>
    </g>
  </g>

  <!-- 右侧：MailHub 四栏立体书籍真实布局示意图 -->
  <g id="book-preview" transform="translate(566 34)">
    <!-- 栏 1：左侧复古书签栏 -->
    <rect x="-8" y="42" width="84" height="292" rx="14" fill="#F8EDF3" stroke="#D9B7C9" stroke-width="1.5" />
    <rect x="0" y="58" width="66" height="32" rx="9" fill="url(#activePill)" />
    <text x="31" y="80" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="700" fill="#FFFFFF">收件</text>
    <rect x="2" y="104" width="64" height="28" rx="8" fill="#EFE0EC" />
    <text x="31" y="124" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" fill="#5D4B6E">未读</text>
    <rect x="2" y="144" width="64" height="28" rx="8" fill="#EFE0EC" />
    <text x="31" y="164" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" fill="#5D4B6E">星标</text>
    <rect x="2" y="184" width="64" height="28" rx="8" fill="#EFE0EC" />
    <text x="31" y="204" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" fill="#5D4B6E">发件</text>
    <rect x="2" y="224" width="64" height="28" rx="8" fill="#EFE0EC" />
    <text x="31" y="244" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" fill="#5D4B6E">草稿</text>
    <rect x="2" y="264" width="64" height="28" rx="8" fill="#EFE0EC" />
    <text x="31" y="284" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" fill="#5D4B6E">归档</text>

    <!-- 书本精装外框与叠层纸边 -->
    <rect x="64" y="10" width="408" height="356" rx="20" fill="url(#coverGrad)" stroke="#B7839A" stroke-width="2" />
    <rect x="72" y="18" width="392" height="340" rx="15" fill="#F3E6EE" />

    <!-- 栏 2：左页（邮件列表） -->
    <rect x="76" y="18" width="190" height="334" rx="13" fill="#FFFDFB" stroke="#E5D4E4" stroke-width="1.2" />
    <text x="90" y="48"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="20" font-weight="700" fill="#3A2D46">收件箱</text>
    <rect x="192" y="27" width="62" height="28" rx="14" fill="#8C6BE8" />
    <text x="223" y="47" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="600" fill="#FFFFFF">写信</text>

    <!-- 高亮选中邮件卡 -->
    <rect x="86" y="70" width="170" height="72" rx="11" fill="#FFEAF3" stroke="#F3B7D3" stroke-width="1.5" />
    <circle cx="100" cy="94" r="6" fill="#0078D4" />
    <text x="112" y="100"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="700" fill="#3A2D46">GitHub 提醒</text>
    <rect x="96" y="114" width="144" height="8" rx="4" fill="#DFC3D6" />
    <rect x="96" y="128" width="104" height="6" rx="3" fill="#EBD5E3" />

    <!-- 第二封邮件卡 -->
    <rect x="86" y="152" width="170" height="68" rx="11" fill="#F8F3FA" stroke="#E8DCF2" stroke-width="1.2" />
    <circle cx="100" cy="175" r="6" fill="#EA4335" />
    <text x="112" y="181"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="600" fill="#4A3963">OAuth2 安全</text>
    <rect x="96" y="196" width="136" height="8" rx="4" fill="#DED1EB" />

    <!-- 第三封邮件卡 -->
    <rect x="86" y="230" width="170" height="68" rx="11" fill="#F8F3FA" stroke="#E8DCF2" stroke-width="1.2" />
    <circle cx="100" cy="253" r="6" fill="#E11D48" />
    <text x="112" y="259"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="600" fill="#4A3963">163 邮箱报告</text>
    <rect x="96" y="274" width="128" height="8" rx="4" fill="#DED1EB" />

    <!-- 分页栏 -->
    <text x="171" y="334" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="600" fill="#6F5E7E">&lt; 1 / 3 &gt;</text>

    <!-- 栏 3：右页（信纸正文） -->
    <rect x="270" y="18" width="190" height="334" rx="13" fill="#FFF9FC" stroke="#E5D4E4" stroke-width="1.2" />
    <!-- 书脊中缝立体阴影 -->
    <rect x="260" y="18" width="16" height="334" fill="url(#spineShadow)" />

    <text x="286" y="50"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="20" font-weight="700" fill="#3A2D46">版本评审纪要</text>
    <rect x="286" y="64" width="84" height="24" rx="12" fill="#EFE6FA" />
    <text x="328" y="82" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="600" fill="#6E4FD4">工作邮箱</text>

    <!-- 信纸内容卡 -->
    <rect x="284" y="100" width="162" height="190" rx="13" fill="#F6F1FB" stroke="#E4D6F2" stroke-width="1.5" />
    <rect x="298" y="120" width="134" height="10" rx="5" fill="#C9B7E3" />
    <rect x="298" y="142" width="118" height="9" rx="4.5" fill="#DDD1EE" />
    <rect x="298" y="162" width="128" height="9" rx="4.5" fill="#DDD1EE" />
    <rect x="298" y="182" width="96" height="9" rx="4.5" fill="#DDD1EE" />
    <!-- 航空信封装饰边与邮戳 -->
    <path d="M298 266 L322 266 L314 276 L290 276 Z" fill="#E7749B" />
    <path d="M328 266 L352 266 L344 276 L320 276 Z" fill="#8C6BE8" />
    <path d="M358 266 L382 266 L374 276 L350 276 Z" fill="#E7749B" />
    <circle cx="418" cy="252" r="18" fill="none" stroke="#C98DB2" stroke-width="2" stroke-dasharray="3 2" />
    <text x="418" y="258" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" font-weight="700" fill="#B5759D">OK</text>

    <rect x="286" y="304" width="76" height="32" rx="16" fill="#8C6BE8" />
    <text x="324" y="326" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="600" fill="#FFFFFF">回复</text>
    <rect x="370" y="304" width="76" height="32" rx="16" fill="#F1E8FC" stroke="#D5C2F2" stroke-width="1.2" />
    <text x="408" y="326" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="600" fill="#6E4FD4">转发</text>

    <!-- 栏 4：右侧「我的邮箱」渠道面板 -->
    <rect x="484" y="26" width="108" height="322" rx="16" fill="#2E2346" stroke="#6E569E" stroke-width="1.5" />
    <text x="538" y="58" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="700" fill="#F5EEFF">我的邮箱</text>

    <rect x="494" y="76" width="88" height="42" rx="11" fill="#8C6BE8" />
    <text x="538" y="103" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="700" fill="#FFFFFF">全部聚合</text>

    <rect x="494" y="130" width="88" height="44" rx="11" fill="#3B2E58" stroke="#5A4785" stroke-width="1" />
    <circle cx="510" cy="152" r="6" fill="#EA4335" />
    <text x="522" y="158"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="600" fill="#ECE4FA">Gmail</text>

    <rect x="494" y="186" width="88" height="44" rx="11" fill="#3B2E58" stroke="#5A4785" stroke-width="1" />
    <circle cx="510" cy="208" r="6" fill="#3B82F6" />
    <text x="522" y="214"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="600" fill="#ECE4FA">QQ</text>

    <rect x="494" y="242" width="88" height="44" rx="11" fill="#3B2E58" stroke="#5A4785" stroke-width="1" />
    <circle cx="510" cy="264" r="6" fill="#E11D48" />
    <text x="522" y="270"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="600" fill="#ECE4FA">163</text>

    <rect x="494" y="298" width="88" height="36" rx="11" fill="#251C3A" stroke="#7A5FB3" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="538" y="322" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei UI', sans-serif"
          font-size="18" font-weight="600" fill="#DFCFFF">+ 绑定</text>
  </g>
</svg>
